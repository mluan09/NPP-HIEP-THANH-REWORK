<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/NPP HIEP THANH.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f1420" />
    <script>
      (() => {
        try {
          const raw = localStorage.getItem('npp_layout_mode');
          const legacyTheme = localStorage.getItem('npp_ui_theme');
          const isModern = raw
            ? JSON.parse(raw) === 'modern'
            : legacyTheme === 'modern';
          document.documentElement.classList.toggle('ui-modern', isModern);
          document.documentElement.classList.toggle('ui-dark', isModern);
          document.documentElement.classList.add('dark');
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>NPP Hiệp Thành - Hệ Thống Quản Lý Phân Phối Bia & Nước Giải Khát</title>
    <meta name="description" content="Hệ thống quản lý phân phối (dự án PRD & Architecture) cho nhà phân phối Bia và Nước giải khát Hiệp Thành. Quản lý kho hàng, tạo đơn nhanh, kiểm soát công nợ, sổ quỹ thu chi thời gian thực." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
