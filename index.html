<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/NPP HIEP THANH.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0f19" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('npp_ui_theme');
          const mode = localStorage.getItem('npp_ui_mode');
          const isModern = theme === 'modern';
          const isDark = !isModern || mode === 'dark';
          document.documentElement.classList.toggle('ui-modern', isModern);
          document.documentElement.classList.toggle('ui-dark', isModern && mode === 'dark');
          document.documentElement.classList.toggle('dark', isDark);
        } catch {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>NPP Hiệp Thành - Hệ Thống Quản Lý Phân Phối Bia & Nước Giải Khát</title>
    <meta name="description" content="Hệ thống quản lý phân phối (dự án PRD & Architecture) cho nhà phân phối Bia và Nước giải khát Hiệp Thành. Quản lý kho hàng, tạo đơn nhanh, kiểm soát công nợ, sổ quỹ thu chi thời gian thực." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
